const catNames={
mr:{akola:"अकोला",khandwa:"खंडवा",maharashtra:"महाराष्ट्र",desh:"देश",rajkaran:"राजकारण",krida:"क्रीडा",manoranjan:"मनोरंजन"},
hi:{akola:"अकोला",khandwa:"खंडवा",maharashtra:"महाराष्ट्र",desh:"भारत",rajkaran:"राजनीति",krida:"खेल",manoranjan:"मनोरंजन"},
en:{akola:"Akola",khandwa:"Khandwa",maharashtra:"Maharashtra",desh:"India",rajkaran:"Politics",krida:"Sports",manoranjan:"Entertainment"}
};
let lang="mr";

function setLang(l){
 lang=l; document.documentElement.lang=l;
 const t=T[l];
 document.querySelectorAll("[data-lang]").forEach(b=>b.classList.toggle("active",b.dataset.lang===l));
 document.getElementById("tag1").textContent=t.tag1;document.getElementById("tag2").textContent=t.tag2;
 document.getElementById("breakingLabel").textContent=t.breaking;document.getElementById("breakingText").textContent=t.breakText;
 document.getElementById("q").placeholder=t.search;document.getElementById("searchBtn").textContent=t.searchBtn;
 document.getElementById("latestTitle").textContent=t.latest;document.getElementById("heroBadge").textContent=t.badge;document.getElementById("heroRead").textContent=t.read;
 document.getElementById("epTitle").textContent=t.epTitle;document.getElementById("epText").textContent=t.epText;document.getElementById("epLink").textContent=t.epBtn;
 document.getElementById("popularTitle").textContent=t.popular;document.getElementById("popularText").textContent=t.popularText;
 document.getElementById("footTag").textContent=t.tag;document.getElementById("footDesc").textContent=t.desc;
 document.getElementById("footSections").textContent=t.sections;document.getElementById("footOther").textContent=t.other;
 renderNav();renderSections();renderHero();
}
function renderNav(){
 const keys=["home","akola","khandwa","maharashtra","desh","rajkaran","krida","manoranjan","epaper"];
 document.getElementById("nav").innerHTML=T[lang].nav.map((x,i)=>`<a href="#${keys[i]}" class="${i===0?"active":""}">${x}</a>`).join("");
 const links=keys.slice(1,5).map((k,i)=>`<li><a href="#${k}">${T[lang].nav[i+1]}</a></li>`).join("");
 const links2=keys.slice(5).map((k,i)=>`<li><a href="#${k}">${T[lang].nav[i+5]}</a></li>`).join("");
 document.getElementById("footList1").innerHTML=links;document.getElementById("footList2").innerHTML=links2;
}
function renderHero(){
 const n=news[0];document.getElementById("heroImg").src=n.img;document.getElementById("heroImg").alt=n[lang].title;document.getElementById("heroTitle").textContent=n[lang].title;
}
function renderSections(){
 const order=["akola","khandwa","maharashtra","desh","rajkaran","krida","manoranjan"];
 document.getElementById("sections").innerHTML=order.map(cat=>{
  const arr=news.filter(n=>n.cat===cat);
  let cards=arr.map((n,i)=>`<article class="news"><img src="${n.img}" alt="${n[lang].title}"><div><h3>${n[lang].title}</h3><p class="small">${catNames[lang][cat]} • ${n.date}</p><button class="read" onclick="openArticle(${news.indexOf(n)})">${T[lang].read}</button></div></article>`).join("");
  if(arr.length===0) cards=`<article class="news"><div><h3>${catNames[lang][cat]}</h3><p>${T[lang].popularText}</p></div></article>`;
  return `<section class="section" id="${cat}"><div class="secthead"><h2>${catNames[lang][cat]}</h2><a class="more" href="#${cat}">${T[lang].more}</a></div><div class="cards">${cards}</div></section>`;
 }).join("");
}
function openArticle(i){
 const n=news[i];document.getElementById("modalImg").src=n.img;document.getElementById("modalTitle").textContent=n[lang].title;
 document.getElementById("modalMeta").textContent=`${n.date} • ${catNames[lang][n.cat]}`;
 document.getElementById("modalText").innerHTML=`<p>${n[lang].text}</p><p><strong>${lang==="mr"?"टीप":lang==="hi"?"नोट":"Note"}:</strong> ${lang==="mr"?"ही माहिती उपलब्ध प्रकाशित स्रोतांवर आधारित संक्षिप्त रूपात दिली आहे. पूर्ण वृत्त गंगा अटलवर वाचा.":lang==="hi"?"यह संक्षिप्त विवरण उपलब्ध प्रकाशित स्रोतों पर आधारित है। पूरी खबर गंगा अटल पर पढ़ें।":"This is a concise summary based on the published source. Read the full report on Ganga Atal."}</p>`;
 document.getElementById("modalSource").innerHTML=`${T[lang].source} <strong>${n.source}</strong>`;
 document.getElementById("articleModal").style.display="block";document.body.style.overflow="hidden";
}
function closeArticle(e){if(!e || e.target.id==="articleModal"){document.getElementById("articleModal").style.display="none";document.body.style.overflow="";}}
function searchNews(e){
 e.preventDefault();const q=document.getElementById("q").value.trim().toLowerCase();const box=document.getElementById("noresult");
 if(!q){box.style.display="none";renderSections();return}
 const hits=news.filter(n=>[n[lang].title,n[lang].text,n.cat].join(" ").toLowerCase().includes(q));
 box.style.display="block";
 box.textContent=hits.length?`${hits.length} ${lang==="en"?"matching article(s) found.":lang==="hi"?"मिलती-जुलती खबरें मिलीं।":"संबंधित बातम्या सापडल्या."}`:T[lang].notfound;
 document.querySelectorAll(".section").forEach(s=>s.style.display="none");
 hits.forEach(n=>{const el=document.getElementById(n.cat);if(el)el.style.display="block";});
}
function toggleDark(){document.body.classList.toggle("dark");document.getElementById("themeBtn").textContent=document.body.classList.contains("dark")?"☀️ Light Mode":"🌙 Dark Mode";}
function openEpaper(e){
 e.preventDefault();
 if(EPAPER_URL){window.open(EPAPER_URL,"_blank");}
 else alert(T[lang].epMissing);
}
setLang("mr");
</script>
