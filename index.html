<!DOCTYPE html>
<html lang="mr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>गंगा अटल | सत्य धारा, अटल निष्पक्ष</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:"Noto Sans Devanagari","Mangal",Arial,sans-serif;background:#f2f4f7;color:#111827;line-height:1.6}
a{text-decoration:none;color:inherit}.container{width:min(1160px,94%);margin:auto}
.topbar{background:#101827;color:#fff;padding:8px 0;font-size:14px;font-weight:700}
.topbar .container{display:flex;justify-content:space-between;gap:15px}
header{background:#fff}.head{min-height:145px;display:flex;align-items:center;justify-content:space-between;padding:20px 0}
.logo{width:370px;max-width:55%;height:auto;object-fit:contain}.actions{display:flex;flex-direction:column;align-items:flex-end;gap:14px}
.langs{display:flex;gap:8px;flex-wrap:wrap}.btn{border:1px solid #cbd5e1;background:#fff;border-radius:8px;padding:9px 15px;font-weight:800;cursor:pointer}
.btn.active,.btn.red{background:#ed1c24;color:#fff;border-color:#ed1c24}
.nav{background:#101827;border-bottom:3px solid #ed1c24}.navin{display:flex;overflow-x:auto;scrollbar-width:none}.navin::-webkit-scrollbar{display:none}
.nav a{color:#fff;font-weight:900;font-size:17px;padding:16px 18px;white-space:nowrap}.nav a:hover,.nav a.active{background:#ed1c24}
.break{margin:20px 0 14px;background:#fff;border-radius:10px;display:flex;overflow:hidden}
.break b{background:#ed1c24;color:#fff;padding:12px 20px;white-space:nowrap}.break span{padding:12px 20px;font-weight:800}
.search{display:flex;gap:10px;margin-bottom:20px}.search input{flex:1;padding:14px;border:1px solid #d5dbe5;border-radius:8px;font-size:16px}
.search button{border:0;background:#ed1c24;color:#fff;border-radius:8px;padding:0 25px;font-weight:900;cursor:pointer}
.grid{display:grid;grid-template-columns:2fr 1fr;gap:18px}.card{background:#fff;border-radius:12px;padding:20px;box-shadow:0 4px 18px #0000000d;margin-bottom:18px}
.title{border-left:6px solid #ed1c24;padding-left:12px;font-size:25px;font-weight:900;margin-bottom:18px}
.hero{position:relative;overflow:hidden;border-radius:12px;min-height:400px;background:#ddd}.hero img{width:100%;height:400px;object-fit:cover}
.overlay{position:absolute;inset:auto 0 0;padding:60px 25px 22px;color:#fff;background:linear-gradient(transparent,#000d)}
.badge{background:#ed1c24;padding:4px 10px;border-radius:5px;font-weight:900}.overlay h1{font-size:30px}
.side{background:#172033;color:#fff;border-radius:12px;padding:22px;margin-bottom:18px}.side h2{font-size:24px;border-left:6px solid #ed1c24;padding-left:10px}
.side p{margin-top:8px}.side a{display:inline-block;margin-top:15px;background:#ed1c24;padding:10px 18px;border-radius:7px;font-weight:900}
.section{margin:28px 0}.secthead{display:flex;justify-content:space-between;align-items:center;border-bottom:3px solid #ed1c24;padding-bottom:8px;margin-bottom:14px}
.secthead h2{font-size:27px}.more{color:#ed1c24;font-weight:900}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}
.news{background:#fff;border-radius:10px;overflow:hidden;box-shadow:0 3px 12px #0000000b}.news img{width:100%;height:165px;object-fit:cover}
.news div{padding:13px}.news h3{font-size:18px;line-height:1.4}.small{font-size:13px;color:#64748b;margin-top:5px}
.read{display:inline-block;margin-top:10px;color:#ed1c24;font-weight:900}
.no-results{background:#fff;border-radius:10px;padding:25px;text-align:center;font-weight:800;display:none;margin-bottom:25px}
footer{margin-top:35px;background:#101827;color:#fff;padding:35px 0 20px}.foot{display:grid;grid-template-columns:2fr 1fr 1fr;gap:25px}
.foot h3{margin-bottom:8px}.foot ul{list-style:none}.foot li{margin:5px 0;color:#cbd5e1}
.copy{text-align:center;border-top:1px solid #334155;margin-top:25px;padding-top:15px;color:#94a3b8}
body.dark{background:#0b1220;color:#f5f7fa}body.dark header,body.dark .card,body.dark .news,body.dark .break,body.dark .no-results{background:#111827;color:#fff}
body.dark .btn{background:#111827;color:#fff;border-color:#64748b}body.dark .search input{background:#111827;color:#fff;border-color:#334155}
body.dark .small{color:#94a3b8}
@media(max-width:850px){.head{flex-direction:column;gap:20px}.logo{max-width:85%}.actions{align-items:center}.grid{grid-template-columns:1fr}.cards{grid-template-columns:1fr 1fr}.foot{grid-template-columns:1fr}}
@media(max-width:520px){.topbar .container{font-size:11px;flex-direction:column}.nav a{font-size:15px;padding:13px 14px}.break{flex-direction:column}.break b,.break span{padding:10px 12px;font-size:13px}.search{flex-direction:column}.search button{padding:12px}.cards{grid-template-columns:1fr}.hero img{height:300px}.overlay h1{font-size:22px}}
</style>
</head>
<body>
<div class="topbar"><div class="container"><span id="tagline"></span><span id="trust"></span></div></div>
<header><div class="container head">
<img src="logo-4.jpg" alt="गंगा अटल" class="logo">
<div class="actions"><div class="langs">
<button class="btn active" data-lang="mr" onclick="setLanguage('mr')">मराठी</button>
<button class="btn" data-lang="hi" onclick="setLanguage('hi')">हिंदी</button>
<button class="btn" data-lang="en" onclick="setLanguage('en')">English</button>
</div><button class="btn red" id="themeBtn" onclick="toggleDark()"></button></div>
</div></header>
<nav class="nav"><div class="container navin" id="nav"></div></nav>
<main id="home" class="container">
<div class="break"><b id="breakingLabel"></b><span id="breakingText"></span></div>
<form class="search" onsubmit="searchNews(event)"><input id="q" type="search" autocomplete="off"><button id="searchBtn" type="submit"></button></form>
<div class="grid">
<section class="card"><div class="title" id="latestTitle"></div><div class="hero">
<img src="logo-4.jpg" alt="गंगा अटल"><div class="overlay"><span class="badge" id="latestBadge"></span><h1 id="heroTitle"></h1></div>
</div></section>
<aside><div class="side" id="epaper"><h2 id="epaperTitle"></h2><p id="epaperText"></p><a href="#" onclick="showEpaper(event)" id="epaperBtn"></a></div>
<div class="card"><div class="title" id="popularTitle"></div><p id="popularText"></p></div></aside>
</div>
<div id="noResults" class="no-results"></div><div id="sections"></div>
</main>
<footer><div class="container foot">
<div><h3 id="footerName"></h3><p id="footerSlogan"></p><p id="footerDesc"></p></div>
<div><h3 id="footerSections"></h3><ul id="footerList1"></ul></div>
<div><h3 id="footerOther"></h3><ul id="footerList2"></ul></div>
</div><div class="container copy" id="copyright"></div></footer>

<script>
const T={
mr:{tag:"गंगा अटल • सत्य धारा, अटल निष्पक्ष",trust:"विश्वसनीय बातम्या • स्थानिक घडामोडी",nav:["मुखपृष्ठ","अकोला","खंडवा","महाराष्ट्र","देश","राजकारण","क्रीडा","मनोरंजन","ई-पेपर"],ids:["home","akola","khandwa","maharashtra","desh","rajkaran","krida","manoranjan","epaper"],break:"🔴 ब्रेकिंग न्यूज",breakText:"गंगा अटलवर वाचा महाराष्ट्रातील आणि देशातील ताज्या घडामोडी",ph:"बातमी शोधा...",search:"🔎 शोधा",latest:"ताज्या बातम्या",hero:"महाराष्ट्रातील ताज्या घडामोडी आणि महत्त्वाच्या बातम्या",ep:"📰 आजचा ई-पेपर",epText:"आजचे वर्तमानपत्र PDF स्वरूपात वाचा.",epBtn:"ई-पेपर वाचा",pop:"लोकप्रिय बातम्या",popText:"महाराष्ट्र आणि देशातील महत्त्वाच्या बातम्यांचे अपडेट येथे वाचा.",more:"आणखी वाचा →",read:"बातमी वाचा →",news:"मधील ताज्या आणि महत्त्वाच्या घडामोडी",small:"ताज्या बातम्या",sec:"विभाग",other:"इतर",desc:"महाराष्ट्र, अकोला, खंडवा आणि देशातील ताज्या घडामोडी.",empty:"कृपया बातमीचे नाव टाइप करा.",none:"या शोधासाठी कोणतीही बातमी सापडली नाही.",dark:"🌙 Dark Mode",light:"☀️ Light Mode",copy:"© 2026 गंगा अटल • सर्व हक्क राखीव",pdf:"तुमची PDF लिंक अजून जोडलेली नाही."},
hi:{tag:"गंगा अटल • सत्य धारा, अटल निष्पक्ष",trust:"विश्वसनीय खबरें • स्थानीय घटनाक्रम",nav:["होम","अकोला","खंडवा","महाराष्ट्र","भारत","राजनीति","खेल","मनोरंजन","ई-पेपर"],ids:["home","akola","khandwa","maharashtra","desh","rajkaran","krida","manoranjan","epaper"],break:"🔴 ब्रेकिंग न्यूज़",breakText:"गंगा अटल पर पढ़ें महाराष्ट्र और देश की ताज़ा खबरें",ph:"खबर खोजें...",search:"🔎 खोजें",latest:"ताज़ा खबरें",hero:"महाराष्ट्र की ताज़ा घटनाओं और महत्वपूर्ण खबरें",ep:"📰 आज का ई-पेपर",epText:"आज का समाचार पत्र PDF रूप में पढ़ें।",epBtn:"ई-पेपर पढ़ें",pop:"लोकप्रिय खबरें",popText:"महाराष्ट्र और देश की महत्वपूर्ण खबरों के अपडेट यहां पढ़ें।",more:"और पढ़ें →",read:"खबर पढ़ें →",news:"की ताज़ा और महत्वपूर्ण खबरें",small:"ताज़ा खबरें",sec:"विभाग",other:"अन्य",desc:"महाराष्ट्र, अकोला, खंडवा और देश की ताज़ा खबरें।",empty:"कृपया खबर का नाम टाइप करें।",none:"इस खोज के लिए कोई खबर नहीं मिली।",dark:"🌙 Dark Mode",light:"☀️ Light Mode",copy:"© 2026 गंगा अटल • सर्वाधिकार सुरक्षित",pdf:"आपकी PDF लिंक अभी जोड़ी नहीं गई है।"},
en:{tag:"Ganga Atal • Truthful & Unbiased",trust:"Trusted News • Local Updates",nav:["Home","Akola","Khandwa","Maharashtra","India","Politics","Sports","Entertainment","E-Paper"],ids:["home","akola","khandwa","desh","rajkaran","krida","manoranjan","epaper"],break:"🔴 Breaking News",breakText:"Read the latest updates from Maharashtra and across India on Ganga Atal",ph:"Search news...",search:"🔎 Search",latest:"Latest News",hero:"Latest developments and important news from Maharashtra",ep:"📰 Today's E-Paper",epText:"Read today's newspaper in PDF format.",epBtn:"Read E-Paper",pop:"Popular News",popText:"Read important news updates from Maharashtra and across India here.",more:"Read More →",read:"Read News →",news:"latest and important news",small:"Latest News",sec:"Sections",other:"Other",desc:"Latest updates from Maharashtra, Akola, Khandwa and across India.",empty:"Please type a news name.",none:"No news found for this search.",dark:"🌙 Dark Mode",light:"☀️ Light Mode",copy:"© 2026 Ganga Atal • All rights reserved",pdf:"Your PDF link has not been added yet."}
};
const sections=["akola","khandwa","maharashtra","desh","rajkaran","krida","manoranjan"];
let lang=localStorage.getItem("gangaLang")||"mr";

function render(){
const t=T[lang];document.documentElement.lang=lang;
document.getElementById("tagline").textContent=t.tag;document.getElementById("trust").textContent=t.trust;
document.getElementById("breakingLabel").textContent=t.break;document.getElementById("breakingText").textContent=t.breakText;
document.getElementById("q").placeholder=t.ph;document.getElementById("searchBtn").textContent=t.search;
document.getElementById("latestTitle").textContent=t.latest;document.getElementById("latestBadge").textContent=t.latest;
document.getElementById("heroTitle").textContent=t.hero;document.getElementById("epaperTitle").textContent=t.ep;
document.getElementById("epaperText").textContent=t.epText;document.getElementById("epaperBtn").textContent=t.epBtn;
document.getElementById("popularTitle").textContent=t.pop;document.getElementById("popularText").textContent=t.popText;
document.getElementById("footerName").textContent=lang==="en"?"Ganga Atal":"गंगा अटल";
document.getElementById("footerSlogan").textContent=lang==="en"?"Truthful & Unbiased":"सत्य धारा, अटल निष्पक्ष";
document.getElementById("footerDesc").textContent=t.desc;document.getElementById("footerSections").textContent=t.sec;
document.getElementById("footerOther").textContent=t.other;document.getElementById("copyright").textContent=t.copy;
document.getElementById("noResults").textContent=t.none;
document.querySelectorAll("[data-lang]").forEach(b=>b.classList.toggle("active",b.dataset.lang===lang));
document.getElementById("nav").innerHTML=t.nav.map((n,i)=>`<a href="#${t.ids[i]}" class="${i===0?'active':''}">${n}</a>`).join("");

document.getElementById("sections").innerHTML=sections.map((key,i)=>{
const n=t.nav[i+1];
return `<section class="section" id="${key}"><div class="secthead"><h2>${n}</h2><a class="more" href="#${key}">${t.more}</a></div>
<div class="cards">${[1,2,3].map((_,j)=>`<article class="news" data-search="${(n+" "+t.news).toLowerCase()}">
<img src="logo-4.jpg" alt="${n}"><div><h3>${n} ${t.news}</h3><p class="small">${n} • ${t.small}</p><a href="#${key}" class="read">${t.read}</a></div></article>`).join("")}</div></section>`;
}).join("");
document.getElementById("footerList1").innerHTML=t.nav.slice(1,5).map((n,i)=>`<li><a href="#${t.ids[i+1]}">${n}</a></li>`).join("");
document.getElementById("footerList2").innerHTML=t.nav.slice(5).map((n,i)=>`<li><a href="#${t.ids[i+5]}">${n}</a></li>`).join("");
updateTheme();
}
function setLanguage(x){lang=x;localStorage.setItem("gangaLang",x);render();document.getElementById("q").value="";window.scrollTo({top:0,behavior:"smooth"});}
function toggleDark(){document.body.classList.toggle("dark");localStorage.setItem("gangaDark",document.body.classList.contains("dark")?"1":"0");updateTheme();}
function updateTheme(){document.getElementById("themeBtn").textContent=document.body.classList.contains("dark")?T[lang].light:T[lang].dark;}
function searchNews(e){
e.preventDefault();const q=document.getElementById("q").value.trim().toLowerCase();const box=document.getElementById("noResults");
if(!q){document.querySelectorAll(".news").forEach(x=>x.style.display="block");box.style.display="none";return;}
let count=0;document.querySelectorAll(".news").forEach(x=>{const ok=x.dataset.search.includes(q)||x.textContent.toLowerCase().includes(q);x.style.display=ok?"block":"none";if(ok)count++;});
box.style.display=count?"none":"block";box.textContent=count?(lang==="en"?count+" result(s) found":lang==="hi"?count+" परिणाम मिले":count+" परिणाम सापडले"):T[lang].none;
}
function showEpaper(e){e.preventDefault();alert(T[lang].pdf);}
if(localStorage.getItem("gangaDark")==="1")document.body.classList.add("dark");
render();
</script>
</body>
</html>
